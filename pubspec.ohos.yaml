# OHOS 平台依赖覆盖配置
# 在 OHOS Flutter SDK 环境下使用此配置替换主 pubspec.yaml
# 用法: cp pubspec.ohos.yaml pubspec.yaml && flutter pub get

# OHOS 平台插件覆盖（flutter_flutter 3.35.x / Dart 3.9.x 环境）
# 降低 share_plus 版本以兼容 Dart 3.9
# 添加 OHOS 平台插件实现
dependency_overrides:
  share_plus: ^10.0.0
  flutter_secure_storage_ohos: ^1.0.0
  share_plus_harmonyos: ^0.0.1
