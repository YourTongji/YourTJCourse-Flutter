# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
tone_instructions: 'Expert Flutter/Dart reviewer for a course selection mobile app. Focus on Riverpod state management, null safety, Dio HTTP patterns, GoRouter navigation, widget performance, and secure storage patterns. Concise feedback in English.'
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main", "dev"]
  path_instructions:
    - path: "lib/**/*.dart"
      instructions: "Review Dart/Flutter code. Check for: proper Riverpod provider patterns, null safety compliance, widget rebuild optimization, Dio error handling, GoRouter route type safety, and json_serializable annotation correctness."
    - path: "test/**/*.dart"
      instructions: "Review Flutter test code. Check for: proper widget testing patterns, meaningful test coverage, mock usage, and test isolation."
    - path: "**/*.yaml"
      instructions: "Review YAML files. Check for: proper pubspec dependency formatting and analysis_options validity."
chat:
  auto_reply: true
