name: Android Test APK

on:
  push:
    branches: [dev, main, master]
    paths:
      - ".github/workflows/android-test.yml"
      - "android/**"
      - "assets/**"
      - "lib/**"
      - "test/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
  pull_request:
    branches: [dev, main, master]
    paths:
      - ".github/workflows/android-test.yml"
      - "android/**"
      - "assets/**"
      - "lib/**"
      - "test/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-test-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create env file
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=${{ secrets.API_BASE_URL || 'https://jcourse.yourtj.de' }}
          CREDIT_API_BASE_URL=${{ secrets.CREDIT_API_BASE_URL || 'https://core.credit.yourtj.de' }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yourtjcourse-flutter-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

      - name: Publish dev prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --cleanup-tag --yes || true
          gh release create dev-latest build/app/outputs/flutter-apk/app-*-release.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "YourTJ Course Dev Latest" \
            --notes "dev 分支自动预发行包。提交：$GITHUB_SHA"
