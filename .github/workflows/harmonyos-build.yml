name: HarmonyOS Build HAP

on:
  push:
    branches: [harmonyos]
    paths:
      - ".github/workflows/harmonyos-build.yml"
      - "lib/**"
      - "test/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "pubspec.ohos.yaml"
      - "ohos/**"
  pull_request:
    branches: [harmonyos]
    paths:
      - ".github/workflows/harmonyos-build.yml"
      - "lib/**"
      - "test/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "pubspec.ohos.yaml"
      - "ohos/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Finn-Technologies/flutter 3.41.9 基于较新 Flutter，含 Dart 3.10+
  FLUTTER_OHOS_REPO: https://github.com/Finn-Technologies/flutter.git
  FLUTTER_OHOS_VERSION: main

jobs:
  # --- Job 1: Standard Flutter CI (standard SDK: analyze + test) ---
  standard-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create env file
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=${{ secrets.API_BASE_URL || 'https://jcourse.yourtj.de' }}
          CREDIT_API_BASE_URL=${{ secrets.CREDIT_API_BASE_URL || 'https://core.credit.yourtj.de' }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # --- Job 2: OHOS Build (HAP with OpenHarmony SDK) ---
  ohos-build:
    runs-on: ubuntu-latest
    needs: [standard-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install OpenHarmony SDK
        uses: openharmony-rs/setup-ohos-sdk@v1.0.0
        with:
          version: "5.0.0"
          cache: true
          components: "all"

      - name: Install OHOS Flutter SDK
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_OHOS_VERSION }} \
            ${{ env.FLUTTER_OHOS_REPO }} \
            /opt/flutter_ohos 2>/dev/null || \
          git clone --depth 1 \
            ${{ env.FLUTTER_OHOS_REPO }} \
            /opt/flutter_ohos
          echo "/opt/flutter_ohos/bin" >> $GITHUB_PATH

      - name: Flutter doctor (OHOS)
        run: |
          flutter doctor -v 2>&1 | head -40 || true

      - name: Create env file
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=${{ secrets.API_BASE_URL || 'https://jcourse.yourtj.de' }}
          CREDIT_API_BASE_URL=${{ secrets.CREDIT_API_BASE_URL || 'https://core.credit.yourtj.de' }}
          EOF

      - name: Apply OHOS pubspec overrides
        run: |
          if [ -f pubspec.ohos.yaml ]; then
            cat pubspec.ohos.yaml >> pubspec.yaml
            echo "Applied OHOS pubspec overrides"
          fi

      - name: OHOS pub get
        working-directory: ohos/entry
        run: |
          # Try building the ohos project with hvigor
          echo "OHOS SDK location: $OHOS_SDK_HOME"
          echo "Looking for hvigor..."

      - name: Flutter version check
        run: |
          flutter --version 2>&1 | head -5
          flutter doctor 2>&1 | head -10

      - name: Build HAP
        continue-on-error: true
        run: |
          flutter build hap --release 2>&1 || \
          flutter build hap 2>&1 || \
          echo "HAP_BUILD_UNSTABLE=true" >> $GITHUB_ENV

      - name: List build outputs
        if: always()
        run: |
          find . -name "*.hap" -o -name "*.apk" 2>/dev/null | head -20 || echo "No build outputs"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yourtjcourse-build-outputs
          path: |
            build/hap/outputs/*.hap
            build/app/outputs/flutter-apk/app-*-release.apk
            ohos/entry/build/default/outputs/default/*.hap
          if-no-files-found: warn

      - name: Publish prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/harmonyos'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete harmonyos-latest --cleanup-tag --yes || true
          HAP=$(find . -name "*.hap" 2>/dev/null | head -5)
          APK=$(find build/app/outputs -name "*.apk" 2>/dev/null | head -5)
          if [ -n "$HAP" ] || [ -n "$APK" ]; then
            gh release create harmonyos-latest $HAP $APK \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "YourTJ Course HarmonyOS Latest" \
              --notes "harmonyos 分支自动预发行包。提交：$GITHUB_SHA"
          fi
