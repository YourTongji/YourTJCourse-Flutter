name: HarmonyOS Build HAP

on:
  push:
    branches: [harmonyos]
    paths:
      - ".github/workflows/harmonyos-build.yml"
      - "lib/**"
      - "test/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "ohos/**"
  pull_request:
    branches: [harmonyos]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  standard-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          cat > .env <<'EOF'
          API_BASE_URL=${{ secrets.API_BASE_URL || 'https://jcourse.yourtj.de' }}
          CREDIT_API_BASE_URL=${{ secrets.CREDIT_API_BASE_URL || 'https://core.credit.yourtj.de' }}
          EOF
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ohos-build:
    runs-on: ubuntu-latest
    needs: [standard-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Install OpenHarmony SDK (HAP native toolchain)
      - name: Install OpenHarmony SDK 6.0
        uses: openharmony-rs/setup-ohos-sdk@v1.0.0
        with:
          version: "6.0"
          cache: true
          components: "all"

      - name: Export OHOS SDK variables
        run: |
          HMOS_SDK_HOME="$RUNNER_TEMP/harmonyos-sdk"
          HMOS_SDK_VERSION="HarmonyOS-NEXT"
          mkdir -p "$HMOS_SDK_HOME/$HMOS_SDK_VERSION"
          cat > "$HMOS_SDK_HOME/$HMOS_SDK_VERSION/sdk-pkg.json" <<'EOF'
          {
            "data": {
              "apiVersion": "12"
            }
          }
          EOF
          ln -s "$OHOS_BASE_SDK_HOME" "$HMOS_SDK_HOME/$HMOS_SDK_VERSION/openharmony"
          ln -s "$OHOS_BASE_SDK_HOME" "$HMOS_SDK_HOME/$HMOS_SDK_VERSION/base"

          echo "HOS_SDK_HOME=$HMOS_SDK_HOME" >> $GITHUB_ENV
          echo "DEVECO_SDK_HOME=$HMOS_SDK_HOME" >> $GITHUB_ENV
          echo "OHOS_SDK_HOME=$OHOS_BASE_SDK_HOME" >> $GITHUB_ENV
          echo "NODE_HOME=$(dirname "$(dirname "$(command -v node)")")" >> $GITHUB_ENV
          echo "OpenHarmony SDK root: $OHOS_BASE_SDK_HOME"
          echo "HarmonyOS SDK wrapper: $HMOS_SDK_HOME"
          find "$OHOS_BASE_SDK_HOME" -maxdepth 2 -type d | sort | head -40
          find "$HMOS_SDK_HOME" -maxdepth 3 \( -type f -o -type l \) | sort

      # Step A: Use standard Flutter SDK for pub get with OHOS-specific overrides.
      # The OHOS Flutter SDK uses Dart 3.11.1, while lkcn_ui currently needs
      # a newer pub solver. Resolve once with standard Flutter, but keep
      # platform implementations within Dart 3.11-compatible versions.
      - name: Set up standard Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create env & resolve OHOS deps (standard SDK)
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=${{ secrets.API_BASE_URL || 'https://jcourse.yourtj.de' }}
          CREDIT_API_BASE_URL=${{ secrets.CREDIT_API_BASE_URL || 'https://core.credit.yourtj.de' }}
          EOF
          cat pubspec.ohos.yaml >> pubspec.yaml
          flutter pub get

      # Step B: Switch to OHOS Flutter SDK for HAP build
      - name: Install OHOS Flutter SDK (3.41.10 / Dart 3.11.1)
        run: |
          git clone --depth 1 --branch 3.41.10-ohos-0.0.1-canary1 \
            https://gitcode.com/openharmony-tpc/flutter_flutter.git \
            /opt/flutter_ohos
          echo "FLUTTER_ROOT=/opt/flutter_ohos" >> $GITHUB_ENV
          echo "/opt/flutter_ohos/bin" >> $GITHUB_PATH

      - name: Fix package_config.json references
        run: |
          flutter --version
          echo "HOS_SDK_HOME=$HOS_SDK_HOME"
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME"
          echo "OHOS_BASE_SDK_HOME=$OHOS_BASE_SDK_HOME"
          echo "OHOS_NDK_HOME=$OHOS_NDK_HOME"
          echo "OHOS_SDK_NATIVE=$OHOS_SDK_NATIVE"
          echo "NODE_HOME=$NODE_HOME"
          # Fix package_config.json to point to OHOS Flutter SDK
          STD_FLUTTER=$(echo /opt/hostedtoolcache/flutter/stable-*/flutter)
          echo "Replacing $STD_FLUTTER references with /opt/flutter_ohos"
          sed -i "s|$STD_FLUTTER|/opt/flutter_ohos|g" .dart_tool/package_config.json
          cat .dart_tool/package_config.json | grep flutter | head -3

      # Step C: Build HAP with --no-pub (skip re-resolution, use fixed config)
      - name: Build HAP
        run: flutter build hap --release --no-pub

      - name: Upload HAP
        uses: actions/upload-artifact@v4
        with:
          name: yourtjcourse-hap
          path: |
            build/hap/outputs/*.hap
            ohos/entry/build/default/outputs/default/*.hap
          if-no-files-found: warn

      - name: Publish prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/harmonyos'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete harmonyos-latest --cleanup-tag --yes || true
          HAP=$(find . -name "*.hap" 2>/dev/null | head -5)
          if [ -n "$HAP" ]; then
            gh release create harmonyos-latest $HAP \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "YourTJ Course HarmonyOS Latest" \
              --notes "harmonyos 分支自动预发行包。提交：$GITHUB_SHA"
          fi
