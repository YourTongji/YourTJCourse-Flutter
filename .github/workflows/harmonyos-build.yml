name: HarmonyOS Build HAP

on:
  push:
    branches: [harmonyos]
    paths:
      - ".github/workflows/harmonyos-build.yml"
      - "lib/**"
      - "test/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "ohos/**"
  pull_request:
    branches: [harmonyos]
    paths-ignore: []
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_OHOS_REPO: https://gitcode.com/openharmony-tpc/flutter_flutter.git
  FLUTTER_OHOS_VERSION: 3.41.10-ohos-0.0.1-canary1

jobs:
  # --- Job 1: Standard Flutter CI (analyze + test on standard SDK) ---
  standard-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          cat > .env <<'EOF'
          API_BASE_URL=${{ secrets.API_BASE_URL || 'https://jcourse.yourtj.de' }}
          CREDIT_API_BASE_URL=${{ secrets.CREDIT_API_BASE_URL || 'https://core.credit.yourtj.de' }}
          EOF
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # --- Job 2: OHOS Build (HAP with OpenHarmony SDK + OHOS Flutter) ---
  ohos-build:
    runs-on: ubuntu-latest
    needs: [standard-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install OpenHarmony SDK 6.0
        uses: openharmony-rs/setup-ohos-sdk@v1.0.0
        with:
          version: "6.0"
          cache: true
          components: "all"

      - name: Install OHOS Flutter SDK (3.41.10 / Dart 3.12+)
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_OHOS_VERSION }} \
            ${{ env.FLUTTER_OHOS_REPO }} /opt/flutter_ohos
          echo "/opt/flutter_ohos/bin" >> $GITHUB_PATH

      - name: Verify OHOS Flutter & Dart version
        run: |
          flutter --version
          flutter doctor 2>&1 | head -10

      - name: Create env file
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=${{ secrets.API_BASE_URL || 'https://jcourse.yourtj.de' }}
          CREDIT_API_BASE_URL=${{ secrets.CREDIT_API_BASE_URL || 'https://core.credit.yourtj.de' }}
          EOF

      - name: Flutter pub get (OHOS)
        run: flutter pub get

      - name: Build HAP
        run: flutter build hap --release

      - name: Upload HAP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yourtjcourse-hap
          path: |
            build/hap/outputs/*.hap
            ohos/entry/build/default/outputs/default/*.hap
          if-no-files-found: error

      - name: Publish prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/harmonyos'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete harmonyos-latest --cleanup-tag --yes || true
          HAP=$(find . -name "*.hap" 2>/dev/null | head -5)
          if [ -n "$HAP" ]; then
            gh release create harmonyos-latest $HAP \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "YourTJ Course HarmonyOS Latest" \
              --notes "harmonyos 分支自动预发行包。提交：$GITHUB_SHA"
          fi
