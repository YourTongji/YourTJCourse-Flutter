name: HarmonyOS Build HAP

on:
  push:
    branches: [harmonyos]
    paths:
      - ".github/workflows/harmonyos-build.yml"
      - "lib/**"
      - "test/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "ohos/**"
  pull_request:
    branches: [harmonyos]
    paths-ignore: []
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_OHOS_REPO: https://gitcode.com/openharmony-tpc/flutter_flutter.git
  FLUTTER_OHOS_VERSION: 3.41.10-ohos-0.0.1-canary1

jobs:
  # --- Job 1: Standard Flutter CI (analyze + test on standard SDK) ---
  standard-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          cat > .env <<'EOF'
          API_BASE_URL=${{ secrets.API_BASE_URL || 'https://jcourse.yourtj.de' }}
          CREDIT_API_BASE_URL=${{ secrets.CREDIT_API_BASE_URL || 'https://core.credit.yourtj.de' }}
          EOF
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # --- Job 2: OHOS Build (HAP with OpenHarmony SDK) ---
  # Strategy: Use standard Flutter SDK for dependency resolution (Dart 3.12+),
  # then switch to OHOS Flutter SDK for HAP compilation with --offline flag.
  ohos-build:
    runs-on: ubuntu-latest
    needs: [standard-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Step A: Install OpenHarmony SDK for HAP toolchain
      - name: Install OpenHarmony SDK 6.0
        uses: openharmony-rs/setup-ohos-sdk@v1.0.0
        with:
          version: "6.0"
          cache: true
          components: "all"

      # Step B: Use standard Flutter SDK for pub get (Dart 3.12+ resolves everything)
      - name: Set up standard Flutter (for dependency resolution)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies (standard SDK)
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=${{ secrets.API_BASE_URL || 'https://jcourse.yourtj.de' }}
          CREDIT_API_BASE_URL=${{ secrets.CREDIT_API_BASE_URL || 'https://core.credit.yourtj.de' }}
          EOF
          flutter pub get

      # Step C: Switch to OHOS Flutter SDK (Dart 3.11.1, can't resolve all deps)
      - name: Install OHOS Flutter SDK
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_OHOS_VERSION }} \
            ${{ env.FLUTTER_OHOS_REPO }} /opt/flutter_ohos
          # Set OHOS Flutter as the primary Flutter SDK
          echo "/opt/flutter_ohos/bin" >> $GITHUB_PATH

      - name: Verify OHOS SDK version
        run: flutter --version

      # Step D: Build HAP with --offline (uses pre-resolved lockfile & cached packages)
      - name: Build HAP
        run: flutter build hap --release --offline

      - name: Upload HAP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yourtjcourse-hap
          path: |
            build/hap/outputs/*.hap
            ohos/entry/build/default/outputs/default/*.hap
          if-no-files-found: error

      - name: Publish prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/harmonyos'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete harmonyos-latest --cleanup-tag --yes || true
          HAP=$(find . -name "*.hap" 2>/dev/null | head -5)
          if [ -n "$HAP" ]; then
            gh release create harmonyos-latest $HAP \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "YourTJ Course HarmonyOS Latest" \
              --notes "harmonyos 分支自动预发行包。提交：$GITHUB_SHA"
          fi
