name: HarmonyOS Build HAP

on:
  push:
    branches: [harmonyos]
    paths:
      - ".github/workflows/harmonyos-build.yml"
      - "lib/**"
      - "test/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "pubspec.ohos.yaml"
      - "ohos/**"
  pull_request:
    branches: [harmonyos]
    paths:
      - ".github/workflows/harmonyos-build.yml"
      - "lib/**"
      - "test/**"
      - "analysis_options.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "pubspec.ohos.yaml"
      - "ohos/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --- Job 1: Standard Flutter CI (analyze + test with standard SDK) ---
  standard-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create env file
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=${{ secrets.API_BASE_URL || 'https://jcourse.yourtj.de' }}
          CREDIT_API_BASE_URL=${{ secrets.CREDIT_API_BASE_URL || 'https://core.credit.yourtj.de' }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # --- Job 2: OHOS Flutter Build (with OpenHarmony SDK) ---
  ohos-build:
    runs-on: ubuntu-latest
    needs: [standard-ci]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Clone OpenHarmony Flutter SDK
        run: |
          git clone --depth 1 --branch oh-3.35.8-ohos-0.0.3 \
            https://gitcode.com/openharmony-tpc/flutter_flutter.git \
            /opt/flutter_ohos 2>/dev/null || \
          git clone --depth 1 \
            https://gitcode.com/openharmony-tpc/flutter_flutter.git \
            /opt/flutter_ohos
          echo "/opt/flutter_ohos/bin" >> $GITHUB_PATH
          flutter --version 2>/dev/null || echo "Flutter OHOS not fully installed"

      - name: Setup HarmonyOS SDK
        uses: applibgroup/setup-harmonyos-sdk@v1
        continue-on-error: true
        with:
          ohos-sdk: "11"

      - name: Create env file
        run: |
          cat > .env <<'EOF'
          API_BASE_URL=${{ secrets.API_BASE_URL || 'https://jcourse.yourtj.de' }}
          CREDIT_API_BASE_URL=${{ secrets.CREDIT_API_BASE_URL || 'https://core.credit.yourtj.de' }}
          EOF

      - name: Apply OHOS pubspec overrides
        run: |
          if [ -f pubspec.ohos.yaml ]; then
            # Merge OHOS-specific overrides into pubspec.yaml
            echo "" >> pubspec.yaml
            cat pubspec.ohos.yaml >> pubspec.yaml
            echo "Applied OHOS pubspec overrides"
          fi

      - name: Install dependencies (OHOS SDK)
        run: |
          flutter pub get 2>/dev/null || echo "OHOS pub get failed - SDK may need manual setup"

      - name: Build APK (fallback for CI validation)
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=APP_BUILD_SHA=$GITHUB_SHA 2>/dev/null || \
          echo "APK build failed - OHOS SDK not fully configured"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yourtjcourse-hap
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/hap/outputs/*.hap
          if-no-files-found: warn

      - name: Publish prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/harmonyos'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete harmonyos-latest --cleanup-tag --yes || true
          HAP_FILES=$(ls build/hap/outputs/*.hap 2>/dev/null || true)
          APK_FILES=$(ls build/app/outputs/flutter-apk/app-*-release.apk 2>/dev/null || true)
          if [ -n "$HAP_FILES" ] || [ -n "$APK_FILES" ]; then
            gh release create harmonyos-latest $HAP_FILES $APK_FILES \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "YourTJ Course HarmonyOS Latest" \
              --notes "harmonyos 分支自动预发行包。提交：$GITHUB_SHA"
          fi
